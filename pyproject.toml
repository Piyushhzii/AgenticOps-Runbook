[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "1.0.0"
description = "Runbook-driven customer support agent with API and CLI entrypoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "langchain-groq",
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
    "python-dotenv",
    "PyYAML",
    "streamlit",
    "uvicorn[standard]",
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]

[project.scripts]
support-agent-api = "app.main:run_api"
support-agent-cli = "app.cli:run_agent"

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.repositories", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]